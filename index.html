<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Price Quotation Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--fg:#1d2327;--cd:#fff;--bd:#cfd6dc;--pr:#12304A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pr:#1f5a85;--bg:#14181c;--fg:#e6e8ea;--cd:#1e252a;--bd:#38424a}}
:root[data-theme="dark"]{--bg:#14181c;--fg:#e6e8ea;--cd:#1e252a;--bd:#38424a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,Arial,'Noto Sans Bengali',sans-serif}
header{background:var(--pr);color:#fff;padding:10px 14px;font-weight:700;font-size:16px}
nav{display:flex;gap:4px;padding:8px 10px 0;overflow-x:auto;border-bottom:1px solid var(--bd);background:var(--cd)}
nav button{border:0;background:none;color:var(--fg);padding:9px 12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font:inherit}
nav button.on{border-color:#19B6C9;font-weight:700}
main{padding:12px;max-width:1500px;margin:auto}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:1050px){.grid{grid-template-columns:430px 1fr;align-items:start}.fm{position:sticky;top:8px;max-height:96vh;overflow:auto}}
.fm,.box{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:12px}
label{display:block;font-size:12px;margin:8px 0 0;font-weight:600}
input,select,textarea{width:100%;box-sizing:border-box;padding:7px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit;margin-top:2px}
textarea{min-height:60px}input[type=checkbox]{width:auto}input[type=color]{height:36px;padding:2px}
.f2,.f3{display:grid;gap:8px;grid-template-columns:1fr 1fr}.f3{grid-template-columns:1fr 1fr 1.4fr}
button.b{background:var(--pr);color:#fff;border:0;border-radius:4px;padding:8px 12px;cursor:pointer;font:inherit;margin:6px 6px 0 0}
button.g{background:none;color:var(--fg);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;cursor:pointer;font:inherit}
.rw{border:1px solid var(--bd);border-radius:6px;padding:8px;margin-top:8px}.rh{display:flex;justify-content:space-between;align-items:center}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
small,.mut{color:#7b858d;font-size:12px}h3{margin:12px 0 2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1d2327;color:#fff;padding:9px 14px;border-radius:6px;display:none;z-index:9;max-width:90%}#toast.err{background:#b3261e}
#pvw{overflow:hidden;width:100%}#pvb{width:794px;transform-origin:0 0;box-shadow:0 1px 8px #0004}
#printHost{display:none}
button.b,button.g{min-height:38px}button.b{padding:10px 16px;font-weight:600}.li>div:last-child{display:flex;flex-wrap:wrap;gap:6px}.fm,.box{border-radius:8px}
@media(max-width:600px){input,select,textarea{font-size:16px}main{padding:8px}.li{flex-wrap:wrap}}
/* quotation page */
.pg{--n:#12304A;width:794px;min-height:1123px;background:#fff;color:#222;font:13px/1.35 Arial,Helvetica,'Noto Sans Bengali',sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding-top:20px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg .qh{display:flex;gap:6px;height:124px}.pg .qh>div{background:var(--n);color:#fff;display:flex}.pg .qh>.l{background:var(--n)}
.pg .l{flex:1.3;align-items:center;gap:20px;padding-left:55px}.pg .r{flex:1;flex-direction:column;justify-content:center;gap:12px;padding-left:34px}
.pg .cn{font-size:24px;font-weight:700;letter-spacing:.8px;display:block}.pg .tg{font-size:14px;max-width:210px;margin-top:2px}
.pg .ci{display:flex;align-items:center;gap:12px;font-size:15px;letter-spacing:.5px}.pg .ci span{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--b);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.pg .bd{padding:0 57px;display:flex;flex-direction:column;flex:1}.pg .to{color:var(--b);font-weight:700;font-size:15px;margin:8px 0 3px}
.pg .qt{width:100%;table-layout:fixed;border-collapse:collapse;margin:10px 0 0;border:1px solid #cbd5dc}.pg .qt th{background:var(--n);color:#fff;padding:5px 4px;border:1px solid var(--n)}
.pg .qt td{border:1px solid #cbd5dc;padding:4px 5px;text-align:center;overflow-wrap:anywhere}.pg .qt th{box-sizing:border-box}.pg .qt td.d{text-align:left}.pg small{color:#222}.pg .qt tr:not(.gt):nth-child(odd):not(:first-child) td{background:#F1F6F8}.pg .qt td.m{text-align:right}
.pg .gt td{background:var(--bt,#E3F6F9);font-weight:700;font-size:15px;color:var(--n);border:1px solid #cbd5dc}.pg .gt:last-child td{background:#E8F0F5}
.pg .sg{display:flex;justify-content:space-between;gap:20px;margin-top:auto;padding-top:8px;align-items:flex-end}
.pg .sl{width:44%}.pg .sr{width:52%}.pg .sl b,.pg .sr .tc{font-size:15px;display:block;color:var(--n)}.pg .sr .tc{font-weight:700}.pg .ds{color:var(--b);font-size:15px}.pg .nm{font-weight:700;font-size:17px;margin-top:6px;color:var(--n)}
.pg .bk{border:1px solid var(--n);border-radius:8px;margin-top:6px;overflow:hidden;font-size:11px}.pg .bh{background:var(--n);color:#fff;font-weight:700;padding:5px 12px}
.pg .bk div.rr{display:flex;padding:3px 12px;border-bottom:1px solid #e3eaee}.pg .rr b{width:36%;color:var(--n)}
.pg .ft{background:var(--n);color:#fff;text-align:center;font-weight:700;font-size:17px;padding:9px 8px;margin:10px 40px 16px}
@media print{@page{size:A4;margin:0}body>*:not(#printHost){display:none!important}#printHost{display:block!important}html,body{background:#fff}.pg{margin:0}}
</style></head><body>

function dlBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function snap(){if(typeof html2canvas=='undefined')throw new Error('Export library did not load. Check your internet connection and reload.');const h=document.createElement('div');h.style.cssText='position:fixed;left:-9999px;top:0;width:794px';const c=$('#page').cloneNode(true);h.appendChild(c);document.body.appendChild(h);try{await (document.fonts&&document.fonts.ready);return await html2canvas(c,{scale:2,backgroundColor:'#fff',useCORS:true,windowWidth:794})}finally{h.remove()}}

for(let i=0;i<n;i++){const s=document.createElement('canvas');s.width=pw;s.height=ph;const x=s.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,pw,ph);x.drawImage(cv,0,-i*ph);if(i)pdf.addPage();pdf.addImage(s.toDataURL('image/jpeg',.95),'JPEG',0,0,210,297)}
pdf.save(fname('pdf'));toast('PDF downloaded.')}catch(e){toast('PDF export failed: '+e.message,1)}}

function ri(r){const v=String(r.img||'');return v.slice(0,4)=='ref:'?(S.imgs[v.slice(4)]||''):v}
function rsv(c){const o={...c};['logo','sign','seal','bankImg'].forEach(k=>{const v=String(o[k]||'');if(v.slice(0,4)=='ref:')o[k]=S.imgs[v.slice(4)]||''});return o}
function gc(){const u=new Set();S.hist.forEach(h=>{h.q.rows.forEach(r=>{if(String(r.img).slice(0,4)=='ref:')u.add(r.img.slice(4))});Object.values(h.q.co||{}).forEach(v=>{if(String(v).slice(0,4)=='ref:')u.add(v.slice(4))})});Object.keys(S.imgs).forEach(k=>u.has(k)||delete S.imgs[k])}
/* per-line image: replace / zoom / drag / fit-fill / reset (row-level only; Product Master is never touched) */
function imgHTML(r){const s=ri(r);if(!r.showImg||!s)return '';const z=+r.imz||1,x=+r.imx||0,y=+r.imy||0,f=r.imf=='cover'?'cover':'contain';
if(z==1&&!x&&!y&&f=='contain')return `<img src="${s}" style="display:block;margin:auto;max-width:108px;max-height:150px;width:auto;height:auto;object-fit:contain">`;
return `<div style="width:108px;height:120px;margin:auto;overflow:hidden;position:relative"><img src="${s}" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:${f};transform:translate(${x}%,${y}%) scale(${z});transform-origin:center"></div>`}
function ieStyle(r){return `width:100%;height:100%;object-fit:${r.imf=='cover'?'cover':'contain'};transform:translate(${+r.imx||0}%,${+r.imy||0}%) scale(${+r.imz||1});transform-origin:center;user-select:none;pointer-events:none`}
function imgTools(i,r){return `<div class="rh" style="margin-top:6px;gap:6px;flex-wrap:wrap;justify-content:flex-start"><label style="margin:0;font-weight:400;cursor:pointer;display:inline-block;padding:7px 11px;border:1px solid var(--bd);border-radius:4px">${r.img?'Change image':'Upload image'}<input type="file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="rowImg(${i},this)"></label>${r.img?`<button class="g" onclick="rowImgClear(${i})">Remove image</button><button class="g" onclick="useMaster(${i})">Use product image</button>`:''}</div><div id="ie${i}" style="display:${r.img&&r.showImg?'block':'none'}">${r.img?ieBody(i,r):''}</div>`}
function ieBody(i,r){const z=Math.round((+r.imz||1)*100);return `<div style="display:flex;gap:10px;align-items:flex-start;margin-top:6px;flex-wrap:wrap"><div id="ief${i}" style="width:144px;height:160px;border:1px dashed var(--bd);overflow:hidden;position:relative;touch-action:none;cursor:grab;background:var(--bg)" onpointerdown="ieDrag(event,${i})"><img id="iei${i}" src="${r.img}" draggable="false" style="position:absolute;left:0;top:0;${ieStyle(r)}"></div><div style="flex:1;min-width:150px"><label>Size <b id="iez${i}">${z}%</b><input type="range" min="30" max="300" value="${z}" oninput="ieSet(${i},'imz',this.value/100)"></label><label>Fit / Fill<select onchange="ieSet(${i},'imf',this.value)"><option value="contain" ${r.imf!='cover'?'selected':''}>Fit (show whole image)</option><option value="cover" ${r.imf=='cover'?'selected':''}>Fill (cover the area)</option></select></label><small>Drag the image to move it.</small><br><button class="g" onclick="ieReset(${i})">Reset</button></div></div>`}
function ieRefresh(i){const r=Q.rows[i],e=$('#iei'+i);if(e)e.style.cssText='position:absolute;left:0;top:0;'+ieStyle(r);const l=$('#iez'+i);if(l)l.textContent=Math.round((+r.imz||1)*100)+'%';pv()}
function ieSet(i,k,v){Q.rows[i][k]=v;ieRefresh(i)}
function ieReset(i){const r=Q.rows[i];r.imz=1;r.imx=0;r.imy=0;r.imf='contain';$('#rows').innerHTML=rowsUI();pv()}
function ieShow(i){const r=Q.rows[i],e=$('#ie'+i);if(e)e.style.display=r.img&&r.showImg?'block':'none'}
function ieDrag(ev,i){const r=Q.rows[i],f=$('#ief'+i),b=f.getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY,x0=+r.imx||0,y0=+r.imy||0,cl=v=>Math.max(-150,Math.min(150,v));try{f.setPointerCapture(ev.pointerId)}catch(e){}f.style.cursor='grabbing';
const mv=e=>{r.imx=cl(x0+(e.clientX-sx)/b.width*100);r.imy=cl(y0+(e.clientY-sy)/b.height*100);ieRefresh(i)},up=()=>{f.removeEventListener('pointermove',mv);f.removeEventListener('pointerup',up);f.style.cursor='grab'};f.addEventListener('pointermove',mv);f.addEventListener('pointerup',up);ev.preventDefault()}
function rowImg(i,inp){const f=inp.files[0];if(!f)return;if(!/^image\/(jpe?g|png|webp)$/.test(f.type)||f.size>15e6)return toast('Use a JPG, PNG or WEBP image under 15 MB.',1);comp(f,1600,.92,1).then(d=>{const r=Q.rows[i];r.img=d;r.showImg=true;r.imz=1;r.imx=0;r.imy=0;r.imf='contain';$('#rows').innerHTML=rowsUI();pv()}).catch(()=>toast('Could not read the image.',1))}
function rowImgClear(i){const r=Q.rows[i];r.img='';r.showImg=false;r.imz=1;r.imx=0;r.imy=0;r.imf='contain';$('#rows').innerHTML=rowsUI();pv()}
function useMaster(i){const r=Q.rows[i],p=S.products.find(x=>x.name.toLowerCase()==String(r.name).trim().toLowerCase());if(!p||!p.img)return toast('No saved product image for this item.',1);r.img=p.img;r.imz=1;r.imx=0;r.imy=0;r.imf='contain';$('#rows').innerHTML=rowsUI();pv()}
/* image frame math in plain pixels (html2canvas ignores object-fit/transform, so exports must not depend on them) */
const LD=new WeakSet();
function dimOf(r){const s=ri(r);if(!s)return null;if(r.iw&&r.ih&&r.ik===s.length)return[r.iw,r.ih];if(!LD.has(r)){LD.add(r);const i=new Image();i.onload=()=>{r.iw=i.naturalWidth;r.ih=i.naturalHeight;r.ik=s.length;LD.delete(r);const k=Q.rows.indexOf(r);if(k>=0)ieRefresh(k);else pv()};i.onerror=()=>LD.delete(r);i.src=s}return null}
function imgBox(r,FW,FH){const d=dimOf(r);if(!d)return null;const z=+r.imz||1,x=+r.imx||0,y=+r.imy||0,k=(r.imf=='cover'?Math.max:Math.min)(FW/d[0],FH/d[1])*z,w=d[0]*k,h=d[1]*k;return `left:${(FW-w)/2+x/100*FW}px;top:${(FH-h)/2+y/100*FH}px;width:${w}px;height:${h}px`}
function imgHTML(r){const s=ri(r);if(!r.showImg||!s)return '';const z=+r.imz||1,x=+r.imx||0,y=+r.imy||0,f=r.imf=='cover'?'cover':'contain',bx=(z==1&&!x&&!y&&f=='contain')?null:imgBox(r,108,120);
if(!bx)return `<img src="${s}" style="display:block;margin:auto;max-width:108px;max-height:150px;width:auto;height:auto">`;
return `<div style="width:108px;height:120px;margin:auto;overflow:hidden;position:relative"><img src="${s}" style="position:absolute;${bx}"></div>`}
function ieBody(i,r){const z=Math.round((+r.imz||1)*100),bx=imgBox(r,144,160),st=bx?`position:absolute;${bx};pointer-events:none`:'position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;pointer-events:none';return `<div style="display:flex;gap:10px;align-items:flex-start;margin-top:6px;flex-wrap:wrap"><div id="ief${i}" style="width:144px;height:160px;border:1px dashed var(--bd);overflow:hidden;position:relative;touch-action:none;cursor:grab;background:var(--bg)" onpointerdown="ieDrag(event,${i})"><img id="iei${i}" src="${r.img}" draggable="false" style="${st}"></div><div style="flex:1;min-width:150px"><label>Size <b id="iez${i}">${z}%</b><input type="range" min="30" max="300" value="${z}" oninput="ieSet(${i},'imz',this.value/100)"></label><label>Fit / Fill<select onchange="ieSet(${i},'imf',this.value)"><option value="contain" ${r.imf!='cover'?'selected':''}>Fit (show whole image)</option><option value="cover" ${r.imf=='cover'?'selected':''}>Fill (cover the area)</option></select></label><small>Drag the image to move it.</small><br><button class="g" onclick="ieReset(${i})">Reset</button></div></div>`}
function ieRefresh(i){const r=Q.rows[i],e=$('#iei'+i);if(e){const b=imgBox(r,144,160);if(b)e.style.cssText='position:absolute;'+b+';pointer-events:none'}const l=$('#iez'+i);if(l)l.textContent=Math.round((+r.imz||1)*100)+'%';pv()}
</script></body></html>
